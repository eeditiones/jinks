<main>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "features": {
            "upload": {
                "enabled": false
            },
            "playground": {
                "enabled": false
            }
        }
    }
    ---
    [% template styles %]
    <style>
        pb-markdown {
            max-width: var(--pb-view-max-width);
            --pb-code-highlight-white-space: pre-wrap;
        }
    </style>
    [% endtemplate %]
    <div class="center">
        <pb-markdown>
        [% block content %][% endblock %]
        </pb-markdown>
    </div>
</main>
