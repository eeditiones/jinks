<template>
---json
{
    "templating": {
        "extends": "templates/edep-base.html"
    },
    "label": "Synchronize Bibliography",
    "features": {
        "forms": {
            "enabled": true
        },
        "toolbar": {
            "navigation": false
        }
    }
}
---
[% template styles %]
<style>
    .zotero-sync {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 1.5rem;
    }
    .zotero-sync h1 {
        margin: 0 0 0.5rem;
        font-weight: 700;
    }
    .zotero-sync p {
        font-size: 1.1rem;
        line-height: 1.45;
    }
    .zotero-sync .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.1rem;
        font: 600 1rem ui-sans-serif, system-ui, sans-serif;
        color: #fff;
        background: #1e293b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        cursor: pointer;
    }
    .zotero-sync .btn:hover {
        background: #0f172a;
    }
    .zotero-sync .loader {
        border: 2px solid #f3f3f3;
        border-top: 2px solid #3498db;
        border-radius: 50%;
        width: 1.25rem;
        height: 1.25rem;
        animation: zotero-sync-spin 1s linear infinite;
        display: inline-block;
        opacity: 0;
    }
    @keyframes zotero-sync-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    fx-trigger.running .loader {
        opacity: 1;
    }
    fx-trigger.running .btn {
        pointer-events: none;
        opacity: 0.9;
    }
    .zotero-sync .results {
        display: block;
        margin-top: 1.5rem;
        padding: 1rem;
        border: thin solid var(--paper-grey-300, #e0e0e0);
        border-radius: 0.25rem;
    }
    .zotero-sync .results:empty {
        display: none;
        border: 0;
        padding: 0;
        margin: 0;
    }
    .zotero-sync .login-hint {
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        border-left: 3px solid var(--jinks-colors-accent, #8b1e1e);
        background: rgba(0, 0, 0, 0.04);
    }
</style>
[% endtemplate %]

[% template fore-prolog %]
    <fx-model>
        <fx-instance type="json" id="default">{}</fx-instance>
        <fx-instance id="helper">
            <data>
                <running>notrunning</running>
            </data>
        </fx-instance>
        <fx-instance id="login" type="json">{}</fx-instance>
        <fx-instance id="vars">
            <data>
                <loggedin>false</loggedin>
            </data>
        </fx-instance>

        <fx-action event="model-construct-done">
            <fx-send submission="s-login"/>
        </fx-action>

        <fx-submission id="s-login" ref="instance('login')?*" url="[[ $context-path ]]/api/login" method="post" replace="instance" instance="login" validate="false" serialization="none">
            <fx-setvalue ref="instance('vars')/loggedin" event="submit-error">false</fx-setvalue>
            <fx-setvalue ref="instance('vars')/loggedin" event="submit-done">true</fx-setvalue>
        </fx-submission>

        <fx-submission id="sync" url="[[ $context-path ]]/api/zotero/sync" method="get" replace="instance" instance="default" validate="false">
            <fx-action event="submit-done">
                <fx-setvalue ref="instance('helper')/running">notrunning</fx-setvalue>
                <fx-refresh force="true"/>
            </fx-action>
            <fx-action event="submit-error">
                <fx-setvalue ref="instance('helper')/running">notrunning</fx-setvalue>
                <fx-message>
                    <pb-i18n key="form.save-failed">Sync failed</pb-i18n>
                </fx-message>
                <fx-refresh force="true"/>
            </fx-action>
        </fx-submission>
    </fx-model>
[% endtemplate %]

[% template content %]
    <div class="zotero-sync">
        <h1><pb-i18n key="menu.zotero-sync">Synchronize Bibliography</pb-i18n></h1>

        <p>Initially synchronization may take a longer time (several minutes) to complete but you can safely close this page — the sync will continue.</p>
        <p>Following updates should be much faster, completing in a matter of seconds.</p>
        <p>Click the button below to start syncing.</p>

        <pb-restricted login="login">
            <p class="login-hint" slot="fallback">
                Please log in (menu top right) to synchronize the bibliography.
            </p>
            <fx-trigger class="{instance('helper')/running}">
                <button class="btn" type="button" aria-live="polite">
                    <span class="label"><pb-i18n key="menu.zotero-sync">Synchronize Bibliography</pb-i18n></span>
                    <span class="loader"/>
                </button>
                <fx-action>
                    <fx-send submission="s-login"/>
                    <fx-setvalue ref="instance('helper')/running">running</fx-setvalue>
                    <fx-reset instance="default"/>
                    <fx-refresh force="true"/>
                </fx-action>
                <fx-send submission="sync" wait="100"/>
            </fx-trigger>
        </pb-restricted>

        <fx-output class="results" value="if (not(exists(instance('default')/?status))) then '' else if (instance('default')/?updated = 0) then 'The cache is up to date.' else concat('Updated ', instance('default')/?updated, ' items (library version ', instance('default')/?libraryVersion, ').')"/>
    </div>
[% endtemplate %]
</template>
