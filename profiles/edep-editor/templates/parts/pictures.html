<details id="pictures" class="group-6">
    <summary>
        <h3>
            <span class="form-hint-wrap">
                <pb-i18n key="form.images">Abbildungen (URLs)</pb-i18n>
                <span class="hint-trigger hint-trigger--passive" tabindex="0" role="button" aria-label="Help">
                    <svg class="icon icon-info"><use href="#info-circle"/></svg>
                </span>
                <div class="form-hint" popover="manual" role="tooltip">
                    <pb-i18n key="form.hint-digital-images"/>
                </div>
            </span>
        </h3>
    </summary>
    <fx-group ref="instance('default')">
        <fx-group ref="facsimile" class="neutral">
            <fx-repeat class="nested-repeat" ref="graphic" id="r-pics">
                <template>
                    <fx-control ref="@url" create="create">
                        <label>URL</label>
                    </fx-control>

                    <fx-trigger>
                        <span class="form-hint-wrap">
                            <span class="hint-trigger hint-trigger--passive" tabindex="0" role="button" aria-label="Help">
                                <svg class="icon icon-remove"><use href="#dash-circle"/></svg>
                            </span>
                            <div class="form-hint" popover="manual" role="tooltip">
                                <pb-i18n key="form.hint-delete-picture"/>
                            </div>
                        </span>
                        <fx-delete ref="."/>
                    </fx-trigger>
                </template>
            </fx-repeat>
            <fx-trigger class="add">
                <span class="form-hint-wrap">
                    <span class="hint-trigger hint-trigger--passive" tabindex="0" role="button" aria-label="Help">
                        <svg class="icon icon-add"><use href="#plus-circle"/></svg>
                    </span>
                    <div class="form-hint" popover="manual" role="tooltip">
                        <pb-i18n key="form.hint-add-picture"/>
                    </div>
                </span>

                <fx-insert context="facsimile" ref="graphic" origin="instance('templates')/graphic"/>
            </fx-trigger>
        </fx-group>
    </fx-group>
</details>
