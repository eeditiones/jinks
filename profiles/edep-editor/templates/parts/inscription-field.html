<details id="inscription-field">
    <summary>
        <h2><pb-i18n key="form.inscription-field">Inschriftfeld</pb-i18n></h2>
    </summary>

    <fx-group ref="physDesc/objectDesc/layoutDesc/layout" id="dimensions">
        <section class="form-row">
            <fx-control class="measurement" ref="dimensions/height">
                <label>
                    <pb-i18n key="form.height">Höhe</pb-i18n>
                </label>
            </fx-control>

            <fx-control class="measurement" ref="dimensions/width">
                <label>
                    <pb-i18n key="form.width">Breite</pb-i18n>
                </label>
            </fx-control>
        </section>

        <fx-control ref="ab" as="node" update-event="leave">
            <label>
                <pb-i18n key="form.description">Beschreibung</pb-i18n>
            </label>
            [% include "templates/parts/xml-editor-provenance.html" %]
        </fx-control>
    </fx-group>

    <fieldset>
        <legend>
            <pb-i18n key="form.letter-size">Buchstabenhöhe</pb-i18n>
        </legend>
        <fx-group ref="physDesc">
            <fx-group ref="handDesc">

                <fx-trigger class="add">
                                        <span class="form-hint-wrap">
                        <span class="hint-trigger hint-trigger--passive" tabindex="0" role="button" aria-label="Help">
                            <svg class="icon icon-add"><use href="#plus-circle"></use></svg>
                        </span>
                        <div class="form-hint" popover="manual" role="tooltip">
                            <pb-i18n key="form.hint-letter-size"/>
                        </div>
                    </span>
                    <fx-insert
                    context="."
                    ref="handNote"
                    origin="instance('templates')/handNote[@scope='letterHeight']"></fx-insert>
                </fx-trigger>

                <fx-repeat
                class="nested-repeat"
                ref="handNote[@scope='letterHeight']"
                id="r-letterHeight">
                    <template>
                        <fx-group class="letter-height-entry">
                            <section class="letter-height-metrics">
                                <fx-control ref="locus">
                                    <label>
                                        <pb-i18n key="form.line"/>
                                    </label>
                                </fx-control>

                                <fx-group ref="dimensions">
                                    <fx-group ref="height" class="letter-height-bounds">
                                        <fx-control ref="@min" create="create" class="measurement">
                                            <label>
                                                <pb-i18n key="form.letter-size-min"/>
                                            </label>
                                        </fx-control>

                                        <fx-control ref="@max" create="create" class="measurement">
                                            <label>
                                                <pb-i18n key="form.letter-size-max"/>
                                            </label>
                                        </fx-control>
                                    </fx-group>
                                </fx-group>
                            </section>
                            <fx-group ref="dimensions" class="letter-height-free">
                                <fx-control ref="height">
                                    <label>
                                        <pb-i18n key="form.letter-size-free"/>
                                    </label>
                                    <textarea class="widget"/>
                                </fx-control>
                            </fx-group>
                        </fx-group>

                        <fx-trigger tabindex="">
                                                        <span class="form-hint-wrap">
                                <span class="hint-trigger hint-trigger--passive" tabindex="0" role="button" aria-label="Help">
                                    <svg class="icon icon-remove"><use href="#dash-circle"></use></svg>
                                </span>
                                <div class="form-hint" popover="manual" role="tooltip">
                                    <pb-i18n key="form.hint-delete-letter-size"/>
                                </div>
                            </span>
                            <fx-delete ref="."></fx-delete>
                        </fx-trigger>
                    </template>
                </fx-repeat>
            </fx-group>
        </fx-group>
    </fieldset>
</details>
